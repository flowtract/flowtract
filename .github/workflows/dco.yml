name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify every pull-request commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          missing=0
          while IFS= read -r commit; do
            if ! git show -s --format=%B "$commit" |
              grep -Eq '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::Commit $commit is missing a valid Signed-off-by trailer."
              missing=1
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          exit "$missing"
