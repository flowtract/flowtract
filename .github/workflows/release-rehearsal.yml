name: Release rehearsal

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected-main commit to rehearse
        required: true
        type: string
      channel:
        description: Release channel to rehearse without publishing
        required: true
        type: choice
        options:
          - bootstrap
          - final

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  rehearse:
    name: ${{ inputs.channel }} exact-SHA rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out accepted source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Verify protected-main identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.ref }}" == "refs/heads/main" ]]
          [[ "${{ github.sha }}" == "${{ inputs.expected_sha }}" ]]
          [[ "$(git rev-parse HEAD)" == "${{ inputs.expected_sha }}" ]]
          git fetch origin main --quiet
          [[ "$(git rev-parse origin/main)" == "${{ inputs.expected_sha }}" ]]
          git diff --exit-code

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pin reviewed npm
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit complete dependency graph
        run: npm audit --audit-level=low

      - name: Validate release contract
        run: npm run release:contract:check

      - name: Rehearse reviewed package
        run: >-
          npm run release:rehearse --
          --channel "${{ inputs.channel }}"
          --expected-sha "${{ inputs.expected_sha }}"
          --output "${{ runner.temp }}/flowtract-release"

      - name: Rehearse npm publication
        run: npm run package:publish-dry-run

      - name: Verify repository integrity
        run: git diff --exit-code

      - name: Attest rehearsal artifact and evidence
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: ${{ runner.temp }}/flowtract-release/*

      - name: Upload immutable rehearsal evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flowtract-${{ inputs.channel }}-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/flowtract-release
          if-no-files-found: error
          retention-days: 30
